name: Setup
description: Provision the pinned Node, Corepack, and Yarn versions and install dependencies.

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Activate pinned Corepack and Yarn
      shell: bash
      run: |
        npm install --global corepack@0.36.0 --force
        corepack enable
        corepack install --global yarn@4.18.0
        test "$(corepack --version)" = "0.36.0"
        test "$(yarn --version)" = "4.18.0"

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
