name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test-vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn test

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:browser

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn build
      - run: yarn test:artifacts

  test-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn playwright install --with-deps chromium
      - run: yarn build
      - run: yarn test:artifacts
      - run: yarn package
      - run: yarn test:package
      - run: xvfb-run -a yarn test:extension
      - name: Upload tested VSIX
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-egon-vsix
          path: dist/egon-vscode-extension.vsix
          if-no-files-found: ignore
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-diagnostics
          path: .context/extension-diagnostics
          if-no-files-found: ignore
          include-hidden-files: true

  dependency-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn npm audit --all --severity high
      - run: yarn npm audit --all --recursive --severity critical

  ci:
    name: ci
    if: always()
    needs:
      - lint
      - typecheck
      - test-vitest
      - test-browser
      - build
      - test-extension
      - dependency-pins
      - dependency-review
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs
        env:
          EVENT_NAME: ${{ github.event_name }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            to_entries | all(
              if .key == "dependency-review" and $event != "pull_request"
              then .value.result == "skipped"
              else .value.result == "success"
              end
            )
          ' <<< "$JOB_RESULTS"
